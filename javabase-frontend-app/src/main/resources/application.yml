spring:
  application:
    name: javabase-frontend-app
  profiles:
    default: dev
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: ${SPRING_MAIL_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${MYSQL_HOST:8.146.233.145}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:javabase}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USERNAME:javabase}
    password: ${MYSQL_PASSWORD:javabase123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    initial-size: 5
    min-idle: 5
    max-active: 20
    max-wait: 60000
    test-while-idle: true
    validation-query: SELECT 1
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:8.146.233.145}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  chat:
    model: ${OPENAI_CHAT_MODEL:gpt-5.4-mini}
  image:
    model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
  embedding:
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: false
  is-share: false
  token-style: uuid
  is-log: true
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
app:
  auth:
    expose-verification-code-in-response: false
  storage:
    provider: ${APP_STORAGE_PROVIDER:ALIYUN_OSS}
    upload-dir-prefix: ${APP_STORAGE_UPLOAD_DIR_PREFIX:upload}
    aliyun:
      region: ${APP_STORAGE_ALIYUN_REGION:cn-hangzhou}
      endpoint: ${APP_STORAGE_ALIYUN_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
      sts-endpoint: ${APP_STORAGE_ALIYUN_STS_ENDPOINT:sts.cn-hangzhou.aliyuncs.com}
      bucket: ${APP_STORAGE_ALIYUN_BUCKET:}
      role-arn: ${APP_STORAGE_ALIYUN_ROLE_ARN:}
      role-session-name-prefix: ${APP_STORAGE_ALIYUN_ROLE_SESSION_NAME_PREFIX:javabase-upload}
      duration-seconds: ${APP_STORAGE_ALIYUN_DURATION_SECONDS:900}
      public-host: ${APP_STORAGE_ALIYUN_PUBLIC_HOST:}
      access-key-id: ${APP_STORAGE_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${APP_STORAGE_ALIYUN_ACCESS_KEY_SECRET:}
  sms:
    aliyun:
      enabled: ${ALIYUN_SMS_ENABLED:false}
      region: ${ALIYUN_SMS_REGION:ap-southeast-1}
      endpoint: ${ALIYUN_SMS_ENDPOINT:dypnsapi.aliyuncs.com}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:速通互联验证码}
      verify-code-template-code: ${ALIYUN_SMS_VERIFY_CODE_TEMPLATE_CODE:100001}
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
  mail:
    smtp:
      enabled: ${APP_MAIL_SMTP_ENABLED:false}
      from: ${APP_MAIL_SMTP_FROM:}
      verification-subject: ${APP_MAIL_SMTP_VERIFICATION_SUBJECT:【JavaBase】邮箱验证码}
  feishu:
    bot:
      enabled: ${APP_FEISHU_BOT_ENABLED:false}
      webhook-url: ${APP_FEISHU_BOT_WEBHOOK_URL:}
