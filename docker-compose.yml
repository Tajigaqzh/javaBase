services:
  mysql:
    image: mysql:8.4
    container_name: javabase-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: javabase
      MYSQL_USER: javabase
      MYSQL_PASSWORD: javabase123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:7.4
    container_name: javabase-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - yes

volumes:
  mysql_data:
  redis_data:
